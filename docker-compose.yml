services:
  # ----------------------------------------------------------------------------
  # PostgreSQL 16 con extensión pgvector oficial
  # ----------------------------------------------------------------------------
  postgres-vector:
    image: pgvector/pgvector:pg16
    container_name: dev_postgres_vector
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres123}
      POSTGRES_DB: vector_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgresql:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ----------------------------------------------------------------------------
  # Microsoft SQL Server 2022 (T-SQL)
  # ----------------------------------------------------------------------------
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: dev_sqlserver
    restart: unless-stopped
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:-PasswordSegura123!}
      MSSQL_PID: "Developer"
    ports:
      - "1433:1433"
    volumes:
      - mssqldata:/var/opt/mssql

  # ----------------------------------------------------------------------------
  # MariaDB 11.x (Compatible con MySQL 8)
  # ----------------------------------------------------------------------------
  mariadb:
    image: mariadb:11
    container_name: dev_mariadb
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD:-mariadb123}
      MARIADB_DATABASE: academia_db
    ports:
      - "3306:3306"
    volumes:
      - mariadbdata:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
  mssqldata:
  mariadbdata:
